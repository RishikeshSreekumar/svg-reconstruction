<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SVG Reconstruction</title>
    <style>
      :root {
        --bg: #17181d;
        --canvas: #101116;
        --panel: #1d1f26;
        --panel2: #262932;
        --line: #2b2e37;
        --text: #e9eaee;
        --dim: #9aa1ad;
        --faint: #666d79;
        --accent: #59a1ff;
        --accent-soft: rgba(89, 161, 255, 0.13);
        --good: #45c98c;
        --warn: #d9a13c;
        --bad: #f0555f;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 8px 28px rgba(0, 0, 0, 0.35);
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 12.5px/1.5 "Inter", ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; border: 2px solid transparent; background-clip: content-box; }
      ::-webkit-scrollbar-thumb:hover { background: var(--faint); border: 2px solid transparent; background-clip: content-box; }
      ::-webkit-scrollbar-track { background: transparent; }
      h1 { font-size: 13px; margin: 0 10px 0 0; font-weight: 600; letter-spacing: .2px; white-space: nowrap; }
      button, select, label.file {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 4px 10px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
        transition: background .1s ease, border-color .1s ease, color .1s ease;
      }
      select { background: var(--panel); }
      button:hover:not(:disabled), label.file:hover { background: var(--panel2); }
      button:disabled { opacity: .35; cursor: default; }
      button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 1px; }
      input[type=file] { display: none; }

      /* toolbar */
      .toolbar { border-bottom: 1px solid var(--line); background: var(--bg); }
      .toolbar .row { display: flex; align-items: center; gap: 6px; padding: 8px 12px; flex-wrap: wrap; }
      .toolbar .row + .row { border-top: 1px solid var(--line); padding-top: 5px; padding-bottom: 5px; }
      .toolbar .gap { flex: 1; }
      .ibtn { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); }
      .ibtn:hover:not(:disabled) { color: var(--text); }
      .ibtn.iconly { padding: 4px 7px; }
      .ibtn.primary { border-color: transparent; background: var(--accent); color: #0d1117; font-weight: 550; }
      .ibtn.primary:hover:not(:disabled) { background: #74b1ff; color: #0d1117; }
      .tbtn {
        display: inline-flex; align-items: center; gap: 5px;
        background: transparent; border: 1px solid transparent; border-radius: 6px;
        padding: 3px 9px; color: var(--dim); font-size: 12px; cursor: pointer;
        transition: background .1s ease, color .1s ease;
      }
      .tbtn:hover { color: var(--text); background: var(--panel2); }
      .tbtn.on { color: var(--accent); background: var(--accent-soft); }
      .comparehint { color: var(--faint); font-size: 11px; }

      /* side panel */
      .side { overflow-y: auto; padding: 2px 10px 10px; background: var(--bg); min-height: 0; }
      .shape {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
        margin-bottom: 6px;
        background: var(--panel);
        transition: border-color .1s ease;
      }
      .shape.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-soft); }
      .shape h3 { margin: 0 0 6px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .shape h3 .tools { display: inline-flex; align-items: center; gap: 3px; }
      .kind { color: var(--accent); font-weight: 550; }
      .conf { font-variant-numeric: tabular-nums; font-size: 11px; margin-left: 4px; }
      .bar { height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; margin-bottom: 8px; }
      .bar > i { display: block; height: 100%; }
      button.bare { background: none; border: none; padding: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
      button.mini {
        padding: 1px 5px;
        font-size: 10px;
        border-radius: 4px;
        border-color: transparent;
        color: var(--dim);
      }
      button.mini:hover { color: var(--text); background: var(--panel2); }
      button.mini.danger:hover { color: var(--bad); background: rgba(240, 85, 95, 0.12); }
      .params { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center; }
      .params.wide { grid-template-columns: auto 1fr auto 1fr; }
      .params label { color: var(--dim); font-size: 11px; }
      .params input, .stylerow input, .textrow input, .textrow select {
        width: 100%;
        background: var(--canvas);
        border: 1px solid var(--line);
        border-radius: 5px;
        color: var(--text);
        padding: 3px 7px;
        font: inherit;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        transition: border-color .1s ease;
      }
      .params input:hover, .stylerow input:hover, .textrow input:hover { border-color: var(--faint); }
      .params input:focus, .stylerow input:focus, .textrow input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
      .params input[type=number]::-webkit-inner-spin-button { opacity: 0; }
      .params input[type=number]:hover::-webkit-inner-spin-button,
      .params input[type=number]:focus::-webkit-inner-spin-button { opacity: 1; }
      .stylerow { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 4px 8px; align-items: center; margin-top: 6px; }
      .stylerow label { color: var(--dim); font-size: 11px; }
      .textrow { display: grid; grid-template-columns: 1fr auto; gap: 6px; margin-bottom: 6px; }
      .textrow select { width: auto; }
      .note { color: var(--dim); font-size: 11px; margin-top: 6px; }
      .segs {
        display: grid;
        grid-template-columns: auto auto 1fr auto;
        gap: 2px 8px;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--line);
        font-size: 11px;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
      }
      .segs .i { color: var(--dim); opacity: .55; text-align: right; }
      .segs .k { color: var(--text); }
      .segs .j { text-align: right; white-space: nowrap; }
      .segs button.bare:hover { color: var(--text); }
      .segparams {
        grid-column: 1 / -1;
        margin: 4px 0 8px;
        padding: 6px 8px;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: var(--accent-soft);
      }
      .stats { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-variant-numeric: tabular-nums; }
      .stats span:nth-child(odd) { color: var(--dim); }
      ul.cons { list-style: none; margin: 0; padding: 0; font-variant-numeric: tabular-nums; }
      ul.cons li { padding: 3px 0; border-bottom: 1px solid var(--line); color: var(--dim); font-size: 11.5px; }
      ul.cons li b { color: var(--text); font-weight: 500; }
    </style>
