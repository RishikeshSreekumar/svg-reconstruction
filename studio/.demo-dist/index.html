<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SVG Reconstruction</title>
    <style>
      :root {
        --bg: #0e1116;
        --panel: #161b22;
        --line: #262d36;
        --text: #e6edf3;
        --dim: #8b949e;
        --accent: #4a9eff;
        --good: #3fb950;
        --warn: #d29922;
        --bad: #f85149;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }
      h1 { font-size: 14px; margin: 0 12px 0 0; font-weight: 600; letter-spacing: .2px; }
      button, select, label.file {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 10px;
        font: inherit;
        cursor: pointer;
      }
      button:hover, label.file:hover { border-color: var(--accent); }
      button:disabled { opacity: .4; cursor: default; }
      input[type=file] { display: none; }
      main { display: grid; grid-template-columns: 1fr 1fr 340px; gap: 1px; background: var(--line); height: calc(100vh - 49px); }
      section { background: var(--bg); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
      .head {
        padding: 6px 12px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: .6px;
        color: var(--dim);
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .stage { flex: 1; display: grid; place-items: center; padding: 16px; overflow: auto; }
      .stage svg { max-width: 100%; max-height: 100%; background: #fff; border-radius: 4px; }
      .side { overflow-y: auto; padding: 10px 12px; }
      .shape {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px 10px;
        margin-bottom: 8px;
        background: var(--panel);
      }
      .shape.sel { border-color: var(--accent); }
      .shape h3 { margin: 0 0 6px; font-size: 12px; display: flex; justify-content: space-between; gap: 8px; cursor: pointer; }
      .kind { color: var(--accent); }
      .conf { font-variant-numeric: tabular-nums; }
      .bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin-bottom: 8px; }
      .bar > i { display: block; height: 100%; }
      .params { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center; }
      .params label { color: var(--dim); font-size: 11px; }
      .params input {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--text);
        padding: 3px 6px;
        font: inherit;
        font-variant-numeric: tabular-nums;
      }
      .params input:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
      .note { color: var(--dim); font-size: 11px; margin-top: 6px; }
      .segs {
        display: grid;
        grid-template-columns: auto auto 1fr auto;
        gap: 2px 8px;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--line);
        font-size: 11px;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
      }
      .segs > span { cursor: pointer; }
      .segs > span:hover { color: var(--text); }
      .segs .i { color: var(--dim); opacity: .55; text-align: right; }
      .segs .k { color: var(--text); }
      .segs .j { text-align: right; white-space: nowrap; }
      .segparams {
        grid-column: 1 / -1;
        margin: 4px 0 8px;
        padding: 6px 8px;
        border: 1px solid var(--accent);
        border-radius: 5px;
        background: var(--bg);
      }
      .segparams .params { grid-template-columns: auto 1fr auto 1fr; }
      .warn { color: var(--warn); font-size: 11.5px; min-height: 0; }
      .warn:not(:empty) { padding: 5px 8px; margin-bottom: 8px; border: 1px solid var(--warn); border-radius: 5px; }
      .stats { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-variant-numeric: tabular-nums; }
      .stats span:nth-child(odd) { color: var(--dim); }
      ul.cons { list-style: none; margin: 0; padding: 0; font-variant-numeric: tabular-nums; }
      ul.cons li { padding: 3px 0; border-bottom: 1px solid var(--line); color: var(--dim); font-size: 11.5px; }
      ul.cons li b { color: var(--text); font-weight: 500; }
      .drop { position: fixed; inset: 0; background: rgba(74,158,255,.15); border: 2px dashed var(--accent); display: none; place-items: center; font-size: 18px; z-index: 9; }
      .drop.on { display: grid; }
      .empty { color: var(--dim); padding: 20px; text-align: center; }
      .toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); cursor: pointer; }
      h2.sec { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); margin: 14px 0 6px; }
    </style>
    <script type="module" crossorigin src="/assets/index-CNxTBsN8.js"></script>
  </head>
  <body>
    <header>
      <h1>SVG Reconstruction</h1>
      <select id="samples"></select>
      <label class="file">Open SVG<input id="file" type="file" accept=".svg,image/svg+xml" /></label>
      <button id="flatten" title="Apply the forward model: destroy the construction the way an exporter would">Flatten first</button>
      <label class="toggle" title="Keep detected equal-radius, alignment, concentric, mirror and rotational relationships while editing"><input id="enforce" type="checkbox" checked /> preserve constraints</label>
      <label class="toggle" title="Show construction handles and gold constraint guides"><input id="overlay" type="checkbox" checked /> guides &amp; handles</label>
      <button id="reset" title="Throw the edits away and reconstruct the input again">Reset</button>
      <button id="export">Export SVG</button>
    </header>
    <main>
      <section>
        <div class="head"><span>Input (path soup)</span><span id="inStat"></span></div>
        <div class="stage" id="inStage"></div>
      </section>
      <section>
        <div class="head"><span>Reconstruction &mdash; drag a handle, or edit a value</span><span id="outStat"></span></div>
        <div class="stage" id="outStage"></div>
      </section>
      <section class="side" id="side"></section>
    </main>
    <div class="drop" id="drop">drop an SVG</div>
  </body>
</html>
