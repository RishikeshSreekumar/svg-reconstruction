<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The mark is the product's thesis drawn once: a shape whose one big
       rounded corner is shown WITH its construction — the dashed osculating
       circle (clipped to the ink, blueprint-style), the radius line out to
       the arc, the ringed center point, and dots at the two tangent points
       where the arc meets the straight edges. Monochrome: black = ink,
       white = construction; the hollow ring marks the thing you'd grab,
       solid dots mark solved facts — role by treatment, not hue. -->
  <defs>
    <clipPath id="ink">
      <path d="M5 7.5 Q5 5 7.5 5 H14 A13 13 0 0 1 27 18 V24.5 Q27 27 24.5 27 H7.5 Q5 27 5 24.5 Z"/>
    </clipPath>
  </defs>
  <path d="M5 7.5 Q5 5 7.5 5 H14 A13 13 0 0 1 27 18 V24.5 Q27 27 24.5 27 H7.5 Q5 27 5 24.5 Z" fill="#141414"/>
  <g clip-path="url(#ink)">
    <circle cx="14" cy="18" r="13" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="1.2" stroke-dasharray="2.6 2.8"/>
    <path d="M14 18 L23.19 8.81" stroke="#ffffff" stroke-opacity=".9" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <circle cx="14" cy="18" r="2.3" fill="#141414" stroke="#ffffff" stroke-width="1.3"/>
  <circle cx="14" cy="5" r="1.7" fill="#ffffff" stroke="#141414" stroke-width="1.2"/>
  <circle cx="27" cy="18" r="1.7" fill="#ffffff" stroke="#141414" stroke-width="1.2"/>
</svg>
