<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SVG Reconstruction</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- IBM Plex: a drafting-table face rather than another Inter clone. The
         slab-ish terminals and open counters suit a tool whose whole subject is
         measured geometry, and Plex Mono pairs for pasted markup. -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* Light only, on purpose: the artwork board is white, so dark chrome
           around it fought the thing being judged. Everything is one family of
           cool neutrals, so the board reads as the brightest surface. */
        --bg: #ffffff;
        --canvas: #eef1f6; /* stage backdrop behind the white board */
        --panel: #f7f8fb; /* raised card */
        --panel2: #eaeef4; /* hover / pressed */
        --line: #e0e5ee;
        --line-strong: #c8d0dd;
        --text: #111726;
        --dim: #58637a; /* 7.0:1 on --bg */
        --faint: #6b7689; /* floor for 11px text: 4.9:1 on --bg */

        /* Primary — indigo. Selection, active tool, focus, everything structural. */
        --primary: #4f46e5;
        --primary-hover: #4338ca;
        --primary-soft: #eeecfd;
        --primary-line: #c7c2f6;
        /* Secondary — teal. Solved/derived facts: tangency, snap, confirmation. */
        --secondary: #0f766e;
        --secondary-soft: #e2f2f0;
        /* Accent — amber. Attention without alarm: hovered spec rows, hints. */
        --accent: #b45309;
        --accent-soft: #fdf1e0;
        --accent-line: #f0d5ac;

        --good: #15803d;
        --warn: #b45309;
        --bad: #be123c;
        --bad-soft: #fdeaee;

        --shadow-sm: 0 1px 2px rgba(17, 23, 38, 0.06);
        --shadow: 0 1px 2px rgba(17, 23, 38, 0.06), 0 10px 28px rgba(17, 23, 38, 0.1);
        --shadow-lg: 0 12px 40px rgba(17, 23, 38, 0.18);

        /* Canvas mark palette — drawn on the white board, not the chrome. */
        --mark: #4338ca;
        --mark-soft: rgba(67, 56, 202, 0.45);
        --mark-hot: #b45309;
        --mark-amber: #92400e;
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        /* Four-step type scale: 10 micro-caps, 11 secondary, 12 controls, 13 body/h1 (h1 differentiates by weight). */
        font: 13px/1.5 "IBM Plex Sans", ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 5px; border: 2px solid transparent; background-clip: content-box; }
      ::-webkit-scrollbar-thumb:hover { background: var(--faint); border: 2px solid transparent; background-clip: content-box; }
      ::-webkit-scrollbar-track { background: transparent; }
      h1 { font-size: 13px; margin: 0; font-weight: 600; letter-spacing: -0.1px; white-space: nowrap; }
      button, select, label.file {
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        padding: 5px 11px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
        transition: background .12s ease, border-color .12s ease, color .12s ease, box-shadow .12s ease;
      }
      button:hover:not(:disabled), select:hover, label.file:hover { background: var(--panel2); border-color: var(--faint); }
      button:disabled { opacity: .4; cursor: default; }
      :focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
      input[type=file] { display: none; }

      /* toolbar */
      .toolbar { border-bottom: 1px solid var(--line); background: var(--bg); }
      .toolbar .row { display: flex; align-items: center; gap: 8px; padding: 9px 14px; flex-wrap: wrap; }
      .toolbar .gap { flex: 1; }
      .ibtn { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); box-shadow: var(--shadow-sm); }
      .ibtn:hover:not(:disabled) { color: var(--text); }
      .ibtn.primary {
        border-color: transparent;
        background: var(--primary);
        color: #fff;
        font-weight: 500;
        box-shadow: 0 1px 2px rgba(79, 70, 229, .3);
      }
      .ibtn.primary:hover:not(:disabled) { background: var(--primary-hover); border-color: transparent; color: #fff; }
      .ibtn.ghost { border-color: transparent; background: transparent; box-shadow: none; }
      .ibtn.ghost:hover:not(:disabled) { background: var(--panel2); border-color: transparent; }

      /* side panel */
      .side { overflow-y: auto; padding: 2px 12px 14px; background: var(--bg); min-height: 0; }
      .shape {
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 9px 11px;
        margin-bottom: 7px;
        background: var(--panel);
        transition: border-color .12s ease, box-shadow .12s ease;
      }
      .shape:hover { border-color: var(--line-strong); }
      .shape.sel { border-color: var(--primary); background: var(--bg); box-shadow: 0 0 0 3px var(--primary-soft); }
      .shape h3 { margin: 0 0 7px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .shape h3 .tools { display: inline-flex; align-items: center; gap: 2px; }
      .kind {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 5px;
        background: var(--primary-soft);
        color: var(--primary);
        font-weight: 600;
        font-size: 10px;
        letter-spacing: .3px;
        text-transform: uppercase;
      }
      .sid { color: var(--dim); font-variant-numeric: tabular-nums; margin-left: 6px; }
      .conf { font-variant-numeric: tabular-nums; font-size: 11px; margin-left: 4px; font-weight: 500; }
      .bar { height: 3px; background: var(--panel2); border-radius: 3px; overflow: hidden; margin-bottom: 9px; }
      .bar > i { display: block; height: 100%; border-radius: 3px; }
      button.bare { background: none; border: none; padding: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; box-shadow: none; }
      button.bare:hover { background: none; border-color: transparent; }
      button.mini {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 3px;
        font-size: 10px;
        border-radius: 5px;
        border-color: transparent;
        background: transparent;
        box-shadow: none;
        color: var(--faint);
      }
      button.mini:hover { color: var(--text); background: var(--panel2); border-color: transparent; }
      button.mini.danger:hover { color: var(--bad); background: var(--bad-soft); border-color: transparent; }
      .params { display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; align-items: center; }
      .params.wide { grid-template-columns: auto 1fr auto 1fr; }
      .params label { color: var(--dim); font-size: 11px; }
      .params input, .stylerow input, .textrow input, .textrow select {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        color: var(--text);
        padding: 4px 8px;
        font: inherit;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        transition: border-color .12s ease, box-shadow .12s ease;
      }
      .params input:hover, .stylerow input:hover, .textrow input:hover { border-color: var(--faint); }
      .params input:focus, .stylerow input:focus, .textrow input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-soft);
      }
      /* Steppers stay faintly visible so they can be discovered, full on intent. */
      .params input[type=number]::-webkit-inner-spin-button { opacity: .35; }
      .params input[type=number]:hover::-webkit-inner-spin-button,
      .params input[type=number]:focus::-webkit-inner-spin-button { opacity: 1; }
      .stylerow { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 5px 10px; align-items: center; margin-top: 8px; }
      .stylerow label { color: var(--dim); font-size: 11px; }
      .textrow { display: grid; grid-template-columns: 1fr auto; gap: 6px; margin-bottom: 7px; }
      .textrow select { width: auto; }
      .note {
        color: var(--dim);
        font-size: 11px;
        margin-top: 8px;
        padding: 5px 8px;
        background: var(--panel2);
        border-radius: 6px;
        line-height: 1.45;
      }
      .shape.sel .note { background: var(--panel); }
      .segs {
        display: grid;
        grid-template-columns: auto auto 1fr auto;
        gap: 0 10px;
        margin-top: 9px;
        padding-top: 8px;
        border-top: 1px solid var(--line);
        font-size: 11px;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
      }
      .segs .i { color: var(--faint); text-align: right; }
      .segs .h { color: var(--faint); font-size: 10px; text-transform: uppercase; letter-spacing: .5px; padding-bottom: 4px; }
      .segs > button { padding: 3px 0; border-radius: 0; }
      .segs > button:hover { color: var(--text); }
      .segwarn { margin-top: 6px; color: var(--warn); font-size: 11px; }
      .segs .k { color: var(--text); }
      .segs .j { text-align: right; white-space: nowrap; }
      .segparams {
        grid-column: 1 / -1;
        margin: 5px 0 9px;
        padding: 8px 9px;
        border: 1px solid var(--primary-line);
        border-radius: 7px;
        background: var(--primary-soft);
      }
      .stats { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-variant-numeric: tabular-nums; }
      .stats span:nth-child(odd) { color: var(--dim); }
      ul.cons { list-style: none; margin: 0; padding: 0; font-variant-numeric: tabular-nums; }
      ul.cons li { padding: 5px 0; border-bottom: 1px solid var(--line); color: var(--dim); font-size: 11px; line-height: 1.5; }
      ul.cons li:last-child { border-bottom: none; }
      ul.cons li b { color: var(--text); font-weight: 500; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
